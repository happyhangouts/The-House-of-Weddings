    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "The House of Weddings by Mubaarqaan",
          "description": "Curated venues, wedding visualization, RSVP guest intelligence, and wedding coordination for discerning couples.",
          "slogan": "Be a guest at your own wedding.",
          "services": [
            "Curated Venues",
            "Wedding Visualization",
            "RSVP & Guest Intelligence",
            "Wedding Coordination"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does 'Be a guest at your own wedding' actually mean?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most couples spend their big day troubleshooting late transport, tracking missing flower deliveries, or playing referee between banquet managers and sound crews. We handle all the behind-the-scenes chaos so you and your families can simply dress up, sip your drinks, hit the dance floor, and truly soak in every moment."
              }
            },
            {
              "@type": "Question",
              "name": "Do you build or fabricate the wedding decor yourselves?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No—and that is our greatest advantage! Because we do not own rental props or fabrication warehouses, we have zero incentive to push unnecessary stage builds or inflate production markups. Instead, we act as your personal design advocate: creating a photorealistic 3D spatial plan and auditing vendor quotes line by line so you get breath-taking decor without inflated bills."
              }
            },
            {
              "@type": "Question",
              "name": "How does 3D wedding visualization save real money?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We build a digital twin of your exact venue with accurate dimensions, lighting setups, and guest flow. You walk through every ritual virtually before signing contracts—preventing oversized stages, redundant lighting rigs, and pricey last-minute fixes."
              }
            },
            {
              "@type": "Question",
              "name": "How do you stop us from wasting money on empty plates and unused hotel rooms?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Between flight delays and last-minute cancellations, 15% to 25% of invited guests often drop out. Our RSVP intelligence tracks real arrival itineraries, confirmed room allocations, and meal guarantees—regularly saving couples ₹4,00,000 to ₹15,00,000+ on over-committed guest guarantees."
              }
            },
            {
              "@type": "Question",
              "name": "Can we still hire The House of Weddings if we already booked our venue?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, absolutely! That is when critical work begins. We step in immediately to run 3D space planning, set up your RSVP tracking engine, review vendor contracts, and coordinate the entire celebration timeline from day one to the final farewell."
              }
            },
            {
              "@type": "Question",
              "name": "Does hiring The House of Weddings pay for itself?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Between audited decor proposals, right-sized banquet food guarantees, negotiated venue rates, and avoided booking redundancies, our clients typically save 10% to 20% on their overall wedding expenditure—far exceeding our advisory fee."
              }
            }
          ]
        }
      ]
    }

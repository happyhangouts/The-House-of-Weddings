<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The House of Weddings - Netlify Forms Detection</title>
</head>
<body>
  <!-- Static form definition for Netlify Forms build crawler -->
  <form name="wedding-enquiry" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="wedding-enquiry" />
    <input type="text" name="bot-field" />
    <input type="text" name="fullName" />
    <input type="tel" name="whatsappNumber" />
    <input type="email" name="email" />
    <input type="text" name="weddingDateType" />
    <input type="text" name="weddingDateValue" />
    <input type="text" name="destinationCity" />
    <input type="number" name="guestCount" />
    <input type="number" name="roomsRequired" />
    <input type="number" name="functionCount" />
    <input type="text" name="approximateBudget" />
    <input type="text" name="servicesNeeded" />
    <input type="text" name="complimentaryRideRequested" />
    <textarea name="additionalNotes"></textarea>
  </form>
</body>
</html>
